name: lint

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: actionlint and zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.32.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "${tarball}" actionlint
          rm "${tarball}"

      - name: Run actionlint
        run: ./actionlint -color

      - name: Run zizmor
        run: pipx run "zizmor==${ZIZMOR_VERSION}" --format=github .
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    name: Offline tests and shellcheck of the action scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release gate's test reads a CRAN package database it writes with R, as the gate does.
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release
          use-public-rspm: true

      - name: Run shellcheck
        run: shellcheck -x actions/*/*.sh

      - name: Run the offline tests
        run: |
          status=0
          for test in actions/*/*-test.sh; do
            echo "::group::$test"
            "$test" || status=1
            echo "::endgroup::"
          done
          exit "$status"
