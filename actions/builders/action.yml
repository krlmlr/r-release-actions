name: "Builder uploads"
description: >
  Uploads a source tarball to win-builder by anonymous FTP, as devtools::check_win_devel() does (`builder: winbuilder`),
  or to macbuilder, as devtools::check_mac_release() does, and waits for its result (`builder: macbuilder`),
  or, on a dry run, reports what it would send,
  with builders.sh beside this file.
  A check result informs and never fails the step; a failed upload does.

inputs:
  builder:
    description: "`winbuilder` or `macbuilder`"
    required: true
  tarball:
    description: "The tarball to upload, named `<package>_<version>.tar.gz`"
    required: true
  flavors:
    description: >-
      `winbuilder`: the flavors, separated by spaces, of `R-devel`, `R-release` and `R-oldrelease`;
      `macbuilder`: one flavor, `r-devel` or `r-release`
    required: true
  timeout-minutes:
    description: "`macbuilder`: how long to wait for the result before reporting it as pending"
    default: "60"
  dry-run:
    description: "`true` sends nothing and reports what would be sent"
    default: "false"

outputs:
  results:
    description: "`winbuilder`: `<flavor>=<uploaded|failed|dry-run>` for each flavor, separated by spaces"
    value: ${{ steps.winbuilder.outputs.results }}
  url:
    description: "`macbuilder`: the result page"
    value: ${{ steps.macbuilder.outputs.url }}
  outcome:
    description: "`macbuilder`: `ok`, `note`, `warning`, `error` or `timeout`; empty on a dry run"
    value: ${{ steps.poll.outputs.outcome }}
  status:
    description: "`macbuilder`: the check's `Status:` line, such as `1 NOTE`"
    value: ${{ steps.poll.outputs.status }}

runs:
  using: "composite"
  steps:
    - id: winbuilder
      if: inputs.builder == 'winbuilder'
      env:
        TARBALL: ${{ inputs.tarball }}
        FLAVORS: ${{ inputs.flavors }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        read -r -a flavors <<<"$FLAVORS"
        if [ "$DRY_RUN" = true ]; then
          "$GITHUB_ACTION_PATH/builders.sh" winbuilder --dry-run "$TARBALL" "${flavors[@]}"
        else
          "$GITHUB_ACTION_PATH/builders.sh" winbuilder "$TARBALL" "${flavors[@]}"
        fi
      shell: bash

    - id: macbuilder
      if: inputs.builder == 'macbuilder'
      env:
        TARBALL: ${{ inputs.tarball }}
        FLAVOR: ${{ inputs.flavors }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        if [ "$DRY_RUN" = true ]; then
          "$GITHUB_ACTION_PATH/builders.sh" macbuilder --dry-run "$TARBALL" "$FLAVOR"
        else
          "$GITHUB_ACTION_PATH/builders.sh" macbuilder "$TARBALL" "$FLAVOR"
        fi
      shell: bash

    - id: poll
      if: inputs.builder == 'macbuilder' && inputs.dry-run != 'true'
      env:
        RESULT_URL: ${{ steps.macbuilder.outputs.url }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: |
        if ! [[ $TIMEOUT_MINUTES =~ ^[0-9]+$ ]]; then
          echo "::error title=No valid timeout::timeout-minutes is '$TIMEOUT_MINUTES', not a whole number of minutes."
          exit 1
        fi
        MACBUILDER_TIMEOUT_SECONDS=$((TIMEOUT_MINUTES * 60)) "$GITHUB_ACTION_PATH/builders.sh" macbuilder-poll "$RESULT_URL"
      shell: bash

    - if: inputs.builder != 'winbuilder' && inputs.builder != 'macbuilder'
      env:
        BUILDER: ${{ inputs.builder }}
      run: |
        echo "::error title=Unknown builder::The input builder is '$BUILDER', neither 'winbuilder' nor 'macbuilder'."
        exit 2
      shell: bash
