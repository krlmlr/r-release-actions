name: "Release gate"
description: >
  Enforces what CRAN requires of a release (mode `hard`): a three-component version, no `Remotes`,
  no dependency on a development version, a NEWS.md section dated as DESCRIPTION and at most 31 days old,
  and no deadline in CRAN's package database.
  Reports on what CRAN expects, and never fails on it (mode `report`): `\value` sections, a stale README,
  URLs, spelling, and `R CMD check --as-cran` on the checked tarball when there is one.
  With release-gate.sh beside this file; `hard` needs R on the PATH to read CRAN's package database,
  and `report` needs the package's dependencies, rmarkdown, urlchecker and spelling installed.

inputs:
  mode:
    description: "`hard` or `report`"
    required: true
  path:
    description: "The package's checkout"
    default: "."
  tarball:
    description: "`report`: the checked tarball to run `R CMD check --as-cran` on; empty skips that check"
    default: ""

outputs:
  package:
    description: "`hard`: the package name"
    value: ${{ steps.run.outputs.package }}
  version:
    description: "`hard`: the version"
    value: ${{ steps.run.outputs.version }}
  passed:
    description: "`hard`: `true` when every hard check passed, `false` otherwise"
    value: ${{ steps.run.outputs.passed }}
  report:
    description: "The checks' results, as Markdown"
    value: ${{ steps.run.outputs.report }}

runs:
  using: "composite"
  steps:
    # The status is kept, not dropped, so that the outputs reach the job even when a hard check fails; the next step fails then.
    - id: run
      env:
        MODE: ${{ inputs.mode }}
        PKG_PATH: ${{ inputs.path }}
        TARBALL: ${{ inputs.tarball }}
      run: |
        script="$GITHUB_ACTION_PATH/release-gate.sh"
        status=0
        case "$MODE" in
          hard) "$script" hard "$PKG_PATH" "$RUNNER_TEMP/release-gate" || status=$? ;;
          report) "$script" report "$PKG_PATH" "$RUNNER_TEMP/release-gate" ${TARBALL:+"$TARBALL"} || status=$? ;;
          *) echo "::error::Unknown mode: $MODE"; status=2 ;;
        esac
        echo "status=$status" >>"$GITHUB_OUTPUT"
      shell: bash

    - if: steps.run.outputs.status != '0'
      env:
        STATUS: ${{ steps.run.outputs.status }}
      run: |
        echo "::error title=Release gate::The release gate failed with status ${STATUS:-unknown}; the errors above name each cause."
        exit 1
      shell: bash
